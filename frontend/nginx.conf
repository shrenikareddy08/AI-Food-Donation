server {
    listen 80;
    server_name localhost;

    # Serve built React static assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://mealbridge-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy root health check
    location /health {
        proxy_pass http://mealbridge-backend:8000/health;
        proxy_set_header Host $host;
    }

    # Proxy Prometheus metrics
    location /metrics {
        proxy_pass http://mealbridge-backend:8000/metrics;
        proxy_set_header Host $host;
    }
}
